[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexos"
version = "0.1.0"
description = "Local-first personal AI operating system skill backbone"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.optional-dependencies]
# av 19 removed the metadata_errors argument that faster-whisper passes to av.open().
voice = ["faster-whisper>=1.1.0", "av>=11,<19", "kokoro>=0.9.4", "soundfile>=0.12"]
# The acceptance gate: `pytest tests -q` (plus scripts/smoke_noninteractive.py and
# scripts/e2e_test.py, which need no extra dependency).
dev = ["pytest>=8"]

[project.scripts]
cortexos = "cortexos.cli:main"

[tool.setuptools.packages.find]
include = ["cortexos*"]
