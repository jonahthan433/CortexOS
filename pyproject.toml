[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexos"
version = "0.1.0"
description = "Local-first personal AI operating system skill backbone"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1.0", "kokoro>=0.9.4", "soundfile>=0.12"]

[project.scripts]
cortexos = "cortexos.cli:main"

[tool.setuptools.packages.find]
include = ["cortexos*"]
