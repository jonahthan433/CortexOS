[bridge]
host = "127.0.0.1"
port = 8765
vault = "./vault"
skills = "./skills"
backend = "codex" # codex | claude

[router]
fast_model_enabled = false
fast_model_base_url = "http://127.0.0.1:11434/v1"
fast_model_name = "qwen2.5:3b"
fast_model_api_key = "local"
# Optional tuning (defaults shown):
# fast_model_timeout_seconds = 45
# jev_enabled = false
# jev_base_url = "https://openrouter.ai/api"
# jev_model = "typesafe/jev-1.13"
# jev_api_key = ""
# jev_min_confidence = 0.5
# jev_timeout_seconds = 10

[queue]
# Durable task queue (SQLite under state/). Defaults shown.
# enabled = true
# db_path = "state/queue.db"
# workers = 2
# max_attempts = 3
# backoff_base_seconds = 30
# backoff_cap_seconds = 900
# task_timeout_seconds = 900
# dedupe_window_seconds = 30
# retention_days = 30
# poll_interval_seconds = 0.5

[providers.codex]
name = "Codex"
command = "codex"
args = ["exec", "--sandbox", "workspace-write", "--skip-git-repo-check", "-"]
input_mode = "stdin"
terminal_command = "codex"
terminal_args = []

[providers.claude]
name = "Claude Code"
command = "claude"
args = ["-p", "--output-format", "text"]
input_mode = "stdin"
terminal_command = "claude"
terminal_args = []

# Register another installed CLI by adding [providers.<id>] with a display name,
# command, args, and terminal_command/terminal_args. Agent prompts use stdin by
# default; set input_mode = "argument" or place {prompt} in args when needed.

[voice]
enabled = true
stt_model = "base.en"
stt_device = "cpu"
stt_compute_type = "int8"
tts_language = "a" # Kokoro: a=American English, b=British English
tts_voice = "af_heart"
browser_fallback = true

# ---------------------------------------------------------------------------
# Universal LLM providers (optional). These are *inference endpoints* that
# agents can be assigned to. CLI coding agents stay under [providers.*].
# API keys can live here (keep this file 0600) or come from environment
# variables via api_key_env. Keys are never returned by the API or logged.
#
# After registering a provider, assign it to an agent from the HUD Settings
# panel or with:  PUT /api/llm/agents/<agent-id>
# Assignments are stored in state/llm_assignments.json (never in this file).
#
# [llm]
# default_timeout_seconds = 60
#
# [llm.providers.gemini]
# kind = "gemini"                     # openai_compatible | anthropic | gemini | ollama
# base_url = "https://generativelanguage.googleapis.com"
# api_key_env = "GEMINI_API_KEY"
# default_model = "gemini-2.0-flash"
# models = ["gemini-2.0-flash", "gemini-2.5-pro"]
#
# [llm.providers.openrouter]
# kind = "openai_compatible"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# models = []
#
# [llm.providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com"
# api_key_env = "ANTHROPIC_API_KEY"
# default_model = "claude-sonnet-4-5"
#
# [llm.providers.ollama]
# kind = "ollama"
# base_url = "http://127.0.0.1:11434/v1"
# default_model = "qwen2.5:3b"
# local = true
#
# Capability notes: openai_compatible/ollama default to chat+streaming+json_mode;
# anthropic/gemini default to non-streaming chat. Override per provider with
# capabilities = { streaming = true } etc. Unsupported calls are rejected with
# a clear error instead of failing obscurely. Local->cloud fallback requires
# allow_cloud_fallback = true on the assignment.
